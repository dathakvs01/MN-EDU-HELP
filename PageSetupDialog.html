<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;700&display=swap');
    
    body {
      font-family: 'Comfortaa', cursive;
      padding: 20px;
      background: linear-gradient(135deg, #FFE5E5, #E5F5FF, #F5E5FF);
      margin: 0;
    }
    
    h2 {
      color: #6644FF;
      text-align: center;
      margin-bottom: 10px;
    }
    
    .tagline {
      text-align: center;
      font-size: 12px;
      font-style: italic;
      color: #888;
      margin-bottom: 20px;
    }
    
    .form-group {
      margin-bottom: 15px;
    }
    
    label {
      display: block;
      margin-bottom: 5px;
      color: #444;
      font-weight: 600;
    }
    
    select {
      width: 100%;
      padding: 10px;
      border: 2px solid #E5E5FF;
      border-radius: 10px;
      font-family: 'Comfortaa', cursive;
      font-size: 14px;
      background: white;
    }
    
    select:focus {
      outline: none;
      border-color: #6644FF;
      box-shadow: 0 0 10px rgba(102, 68, 255, 0.2);
    }
    
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    
    button {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 20px;
      font-family: 'Comfortaa', cursive;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #6644FF, #AA44FF);
      color: white;
    }
    
    .btn-primary:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(102, 68, 255, 0.3);
    }
    
    .btn-secondary {
      background: #E5E5FF;
      color: #6644FF;
    }
    
    .btn-secondary:hover {
      background: #D5D5FF;
    }
    
    .message {
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 15px;
      text-align: center;
      display: none;
    }
    
    .success {
      background: #E5FFCC;
      color: #44AA44;
      border: 2px solid #44AA44;
    }
    
    .error {
      background: #FFE5E5;
      color: #FF4444;
      border: 2px solid #FF4444;
    }
    
    .info-text {
      font-size: 12px;
      color: #888;
      font-style: italic;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <h2>📄 Page Setup</h2>
  <div class="tagline">practice made easy now</div>
  
  <div id="message" class="message"></div>
  
  <form id="pageSetupForm" onsubmit="handleSubmit(event)">
    <div class="form-group">
      <label for="pageSize">Page Size:</label>
      <select id="pageSize" name="pageSize" required>
        <option value="A4">A4 (210 × 297 mm)</option>
        <option value="LETTER">Letter (8.5 × 11 in)</option>
        <option value="LEGAL">Legal (8.5 × 14 in)</option>
      </select>
      <div class="info-text">Select the paper size for printing</div>
    </div>
    
    <div class="form-group">
      <label for="orientation">Orientation:</label>
      <select id="orientation" name="orientation" required>
        <option value="portrait">📄 Portrait</option>
        <option value="landscape">📐 Landscape</option>
      </select>
      <div class="info-text">Choose page orientation</div>
    </div>
    
    <div class="button-group">
      <button type="submit" class="btn-primary">✅ Apply</button>
      <button type="button" class="btn-secondary" onclick="google.script.host.close()">❌ Cancel</button>
    </div>
  </form>
  
  <script>
    function handleSubmit(event) {
      event.preventDefault();
      
      const settings = {
        pageSize: document.getElementById('pageSize').value,
        orientation: document.getElementById('orientation').value
      };
      
      showMessage('Applying settings...', 'info');
      
      google.script.run
        .withSuccessHandler(onSuccess)
        .withFailureHandler(onError)
        .applyPageSettings(settings);
    }
    
    function onSuccess(result) {
      if (result.success) {
        showMessage(result.message, 'success');
        setTimeout(() => {
          google.script.host.close();
        }, 2000);
      } else {
        showMessage(result.message, 'error');
      }
    }
    
    function onError(error) {
      showMessage('Error: ' + error.message, 'error');
    }
    
    function showMessage(msg, type) {
      const messageDiv = document.getElementById('message');
      messageDiv.textContent = msg;
      messageDiv.className = 'message ' + type;
      messageDiv.style.display = 'block';
    }
  </script>
</body>
</html>
