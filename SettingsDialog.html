<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;700&display=swap');
    
    body {
      font-family: 'Comfortaa', cursive;
      padding: 20px;
      background: linear-gradient(135deg, #FFE5E5, #E5F5FF, #F5E5FF);
      margin: 0;
    }
    
    h2 {
      color: #6644FF;
      text-align: center;
      margin-bottom: 10px;
    }
    
    .tagline {
      text-align: center;
      font-size: 12px;
      font-style: italic;
      color: #888;
      margin-bottom: 20px;
    }
    
    .menu-list {
      max-height: 500px;
      overflow-y: auto;
      background: white;
      border-radius: 15px;
      padding: 15px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }
    
    .menu-item {
      background: linear-gradient(135deg, #FFE5E5, #E5F5FF);
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 10px;
      border: 2px solid #E5E5FF;
    }
    
    .menu-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    
    .menu-name {
      font-weight: 700;
      color: #6644FF;
      font-size: 16px;
    }
    
    .menu-info {
      font-size: 12px;
      color: #666;
      margin-bottom: 5px;
    }
    
    .menu-content {
      font-size: 12px;
      color: #444;
      background: white;
      padding: 10px;
      border-radius: 5px;
      margin-top: 10px;
      max-height: 100px;
      overflow-y: auto;
    }
    
    .button-group {
      display: flex;
      gap: 5px;
    }
    
    button {
      padding: 8px 15px;
      border: none;
      border-radius: 15px;
      font-family: 'Comfortaa', cursive;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .btn-edit {
      background: #E5F5FF;
      color: #4488FF;
    }
    
    .btn-delete {
      background: #FFE5E5;
      color: #FF4444;
    }
    
    .btn-edit:hover,
    .btn-delete:hover {
      transform: scale(1.05);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
    }
    
    .empty-state {
      text-align: center;
      padding: 40px;
      color: #888;
    }
    
    .message {
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 15px;
      text-align: center;
      display: none;
    }
    
    .success {
      background: #E5FFCC;
      color: #44AA44;
      border: 2px solid #44AA44;
    }
    
    .error {
      background: #FFE5E5;
      color: #FF4444;
      border: 2px solid #FF4444;
    }
    
    .loading {
      text-align: center;
      padding: 20px;
      color: #6644FF;
    }
  </style>
</head>
<body>
  <h2>⚙️ MN EDU HELP Settings</h2>
  <div class="tagline">practice made easy now</div>
  
  <div id="message" class="message"></div>
  
  <div id="menuList" class="menu-list">
    <div class="loading">Loading menus...</div>
  </div>
  
  <script>
    // Load menus on page load
    window.onload = function() {
      loadMenus();
    };
    
    function loadMenus() {
      google.script.run
        .withSuccessHandler(displayMenus)
        .withFailureHandler(onError)
        .getAllMenus();
    }
    
    function displayMenus(menus) {
      const listDiv = document.getElementById('menuList');
      
      if (!menus || menus.length === 0) {
        listDiv.innerHTML = '<div class="empty-state">No custom menus found. Add one from Admin menu!</div>';
        return;
      }
      
      listDiv.innerHTML = '';
      
      menus.forEach(menu => {
        const menuDiv = document.createElement('div');
        menuDiv.className = 'menu-item';
        menuDiv.innerHTML = `
          <div class="menu-header">
            <div class="menu-name">${menu.name}</div>
            <div class="button-group">
              <button class="btn-edit" onclick="editMenu('${menu.id}')">✏️ Edit</button>
              <button class="btn-delete" onclick="deleteMenu('${menu.id}', '${menu.name}')">🗑️ Delete</button>
            </div>
          </div>
          <div class="menu-info">Parent: ${menu.parent} | Category: ${menu.category}</div>
          <div class="menu-info">Created: ${new Date(menu.createdAt).toLocaleString()}</div>
          <div class="menu-content">${menu.content.substring(0, 200)}${menu.content.length > 200 ? '...' : ''}</div>
        `;
        listDiv.appendChild(menuDiv);
      });
    }
    
    function editMenu(menuId) {
      // Note: Full edit functionality would require additional dialog
      showMessage('Edit functionality - please use Add New Menu to create updated version', 'info');
    }
    
    function deleteMenu(menuId, menuName) {
      if (confirm('Are you sure you want to delete "' + menuName + '"?')) {
        google.script.run
          .withSuccessHandler(onDeleteSuccess)
          .withFailureHandler(onError)
          .deleteMenu(menuId);
      }
    }
    
    function onDeleteSuccess(result) {
      if (result.success) {
        showMessage(result.message, 'success');
        // Reload menus
        setTimeout(loadMenus, 1000);
      } else {
        showMessage(result.message, 'error');
      }
    }
    
    function onError(error) {
      showMessage('Error: ' + error.message, 'error');
    }
    
    function showMessage(msg, type) {
      const messageDiv = document.getElementById('message');
      messageDiv.textContent = msg;
      messageDiv.className = 'message ' + type;
      messageDiv.style.display = 'block';
      
      // Auto-hide after 5 seconds
      setTimeout(() => {
        messageDiv.style.display = 'none';
      }, 5000);
    }
  </script>
</body>
</html>
