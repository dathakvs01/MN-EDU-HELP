<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;700&display=swap');
    
    body {
      font-family: 'Comfortaa', cursive;
      padding: 20px;
      background: linear-gradient(135deg, #FFE5E5, #E5F5FF, #F5E5FF);
      margin: 0;
    }
    
    h2 {
      color: #6644FF;
      text-align: center;
      margin-bottom: 10px;
    }
    
    .tagline {
      text-align: center;
      font-size: 12px;
      font-style: italic;
      color: #888;
      margin-bottom: 20px;
    }
    
    .backup-list {
      max-height: 350px;
      overflow-y: auto;
      background: white;
      border-radius: 15px;
      padding: 15px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }
    
    .backup-item {
      background: linear-gradient(135deg, #FFFFCC, #E5FFCC);
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 10px;
      border: 2px solid #E5FFCC;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .backup-info {
      flex: 1;
    }
    
    .backup-desc {
      font-weight: 700;
      color: #6644FF;
      margin-bottom: 5px;
    }
    
    .backup-time {
      font-size: 12px;
      color: #666;
    }
    
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 15px;
      font-family: 'Comfortaa', cursive;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      background: linear-gradient(135deg, #6644FF, #AA44FF);
      color: white;
    }
    
    button:hover {
      transform: scale(1.05);
      box-shadow: 0 3px 10px rgba(102, 68, 255, 0.3);
    }
    
    .empty-state {
      text-align: center;
      padding: 40px;
      color: #888;
    }
    
    .message {
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 15px;
      text-align: center;
      display: none;
    }
    
    .success {
      background: #E5FFCC;
      color: #44AA44;
      border: 2px solid #44AA44;
    }
    
    .error {
      background: #FFE5E5;
      color: #FF4444;
      border: 2px solid #FF4444;
    }
    
    .loading {
      text-align: center;
      padding: 20px;
      color: #6644FF;
    }
    
    .info-box {
      background: #E5F5FF;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 12px;
      color: #4488FF;
      border: 2px solid #4488FF;
    }
  </style>
</head>
<body>
  <h2>🔄 MN EDU HELP Restore</h2>
  <div class="tagline">practice made easy now</div>
  
  <div class="info-box">
    ℹ️ Restore your menus to a previous version. All changes are tracked automatically.
  </div>
  
  <div id="message" class="message"></div>
  
  <div id="backupList" class="backup-list">
    <div class="loading">Loading backups...</div>
  </div>
  
  <script>
    // Load backups on page load
    window.onload = function() {
      loadBackups();
    };
    
    function loadBackups() {
      google.script.run
        .withSuccessHandler(displayBackups)
        .withFailureHandler(onError)
        .getAllBackups();
    }
    
    function displayBackups(backups) {
      const listDiv = document.getElementById('backupList');
      
      if (!backups || backups.length === 0) {
        listDiv.innerHTML = '<div class="empty-state">No backups found yet.</div>';
        return;
      }
      
      listDiv.innerHTML = '';
      
      // Sort by timestamp (newest first)
      backups.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
      
      backups.forEach(backup => {
        const backupDiv = document.createElement('div');
        backupDiv.className = 'backup-item';
        
        const date = new Date(backup.timestamp);
        const formattedDate = date.toLocaleString();
        
        backupDiv.innerHTML = `
          <div class="backup-info">
            <div class="backup-desc">${backup.description}</div>
            <div class="backup-time">📅 ${formattedDate}</div>
          </div>
          <button onclick="restoreBackup('${backup.id}', '${backup.description}')">🔄 Restore</button>
        `;
        listDiv.appendChild(backupDiv);
      });
    }
    
    function restoreBackup(backupId, description) {
      if (confirm('Are you sure you want to restore to: "' + description + '"?\n\nThis will replace current menus with this backup.')) {
        showMessage('Restoring...', 'info');
        
        google.script.run
          .withSuccessHandler(onRestoreSuccess)
          .withFailureHandler(onError)
          .restoreFromBackup(backupId);
      }
    }
    
    function onRestoreSuccess(result) {
      if (result.success) {
        showMessage(result.message + ' Please reload the page to see changes.', 'success');
      } else {
        showMessage(result.message, 'error');
      }
    }
    
    function onError(error) {
      showMessage('Error: ' + error.message, 'error');
    }
    
    function showMessage(msg, type) {
      const messageDiv = document.getElementById('message');
      messageDiv.textContent = msg;
      messageDiv.className = 'message ' + type;
      messageDiv.style.display = 'block';
    }
  </script>
</body>
</html>
